services:
  - type: web
    name: superchat
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.serve
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: SUPERCHAT_ROUTING_MODE
        value: auto
      - key: COOKIE_SECURE
        value: "true"
